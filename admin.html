<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>管理画面 ― 未来民主党</title>
<style>
  :root{
    --ink:#111112; --ink-soft:#63656f; --paper:#ffffff; --paper-deep:#F1F6E8;
    --line:#E2E4DC; --lime:#C4FF4E; --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-deep);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;font-size:14.5px;line-height:1.8;}
  a{color:inherit;}
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}
  h1{font-size:20px;margin:0 0 6px;}
  h2{font-size:16px;margin:0 0 14px;}
  p.hint{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px;}
  label{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;}
  input[type="text"],input[type="password"],input[type="date"],input[type="url"],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--paper);color:var(--ink);
  }
  textarea{min-height:120px;resize:vertical;}
  input[type="file"]{margin-top:4px;}
  button{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:10px 22px;font-weight:700;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{opacity:.85;}
  .btn-outline{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .btn-danger{background:var(--danger);color:#fff;padding:6px 14px;font-size:12.5px;}
  .btn-small{padding:6px 14px;font-size:12.5px;}
  header.app-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .tabs{display:flex;gap:10px;margin-bottom:20px;}
  .tab-btn{background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);}
  .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tab-panel[hidden]{display:none;}
  .item-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row .meta{font-size:12px;color:var(--ink-soft);}
  .item-row .actions{display:flex;gap:8px;flex:none;}
  .item-row img{width:36px;height:36px;object-fit:cover;border-radius:6px;flex:none;}
  .item-row-main{display:flex;align-items:center;gap:12px;min-width:0;}
  .item-row-text{min-width:0;}
  .item-row-text .title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #statusBar{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;text-align:center;font-weight:700;color:#fff;background:var(--ink);z-index:50;}
  #statusBar.success{background:#2e7d32;}
  #statusBar.error{background:var(--danger);}
  .form-actions{display:flex;gap:10px;margin-top:20px;}
  .sns-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:640px){ .sns-row{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="tokenScreen" class="wrap">
  <div class="card">
    <h1>管理画面ログイン</h1>
    <p class="hint">GitHubの個人アクセストークン（Fine-grained PAT。対象リポジトリを <code>miraiminshu</code> に限定し、権限は Contents: Read and write のみでOK）を入力してください。一度入力すれば、この端末のブラウザに保存されます。</p>
    <label for="tokenInput">アクセストークン</label>
    <input type="password" id="tokenInput" placeholder="github_pat_xxxxxxxx">
    <div class="form-actions">
      <button class="btn-primary" id="tokenSaveBtn">保存してログイン</button>
    </div>
  </div>
</div>

<div id="adminApp" class="wrap" hidden>
  <header class="app-header">
    <h1>未来民主党 管理画面</h1>
    <button class="btn-outline btn-small" id="logoutBtn">ログアウト</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="news">お知らせ</button>
    <button class="tab-btn" data-tab="members">所属議員</button>
  </div>

  <section id="tab-news" class="tab-panel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>お知らせ一覧</h2>
        <button class="btn-primary btn-small" id="newsAddBtn">+ 新規追加</button>
      </div>
      <div id="newsList"></div>
    </div>
  </section>

  <section id="tab-members" class="tab-panel" hidden>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>所属議員一覧</h2>
        <button class="btn-primary btn-small" id="memberAddBtn">+ 新規追加</button>
      </div>
      <div id="memberList"></div>
    </div>
  </section>

  <section id="formArea"></section>
</div>

<div id="statusBar" hidden></div>

<script src="admin.js"></script>
</body>
</html>
